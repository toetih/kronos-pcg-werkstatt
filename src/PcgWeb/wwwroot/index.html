<script>
  // Basisadresse = Ordner der Seite, damit die App unter jeder Adresse läuft (lokal und als claude.ai-Artifact).
  (function () {
    var base = document.createElement('base');
    base.href = location.origin + location.pathname.replace(/[^/]*$/, '');
    document.head.prepend(base);
  })();

  // Fertige Datei an den Nutzer geben. Im claude.ai-Artifact über die Download-Funktion des Viewers
  // (nur ZIP erlaubt), sonst als normaler Browser-Download.
  window.pcgSave = async function (filename, bytes) {
    var blob = new Blob([bytes]);
    var downloads = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (downloads) {
      try {
        await downloads.save({ filename: filename, data: blob });
        return 'saved';
      } catch (e) {
        return (e && e.code) || 'error';
      }
    }
    var link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    link.click();
    setTimeout(function () { URL.revokeObjectURL(link.href); }, 10000);
    return 'saved';
  };

  // Im claude.ai-Viewer nur ZIP erlaubt (kein .PCG); lokal oder unter eigener Adresse direkt als .PCG.
  window.pcgNeedsZip = function () {
    return !!(window.claude && window.claude.use);
  };

  // Sprache: ?lang=en|de in der Adresse, sonst die gemerkte Auswahl, sonst die Browser-Sprache (Deutsch, alles andere Englisch).
  window.pcgLanguage = function () {
    try {
      var chosen = new URLSearchParams(location.search).get('lang') || localStorage.getItem('pcgLang');
      if (chosen === 'de' || chosen === 'en') return chosen;
    } catch (e) { }
    return (navigator.language || 'de').toLowerCase().indexOf('de') === 0 ? 'de' : 'en';
  };
  // Sprache wechseln: merken und neu laden (geladene Dateien gehen dabei verloren, deshalb fragt die Oberfläche vorher).
  window.pcgSetLanguage = function (language) {
    try { localStorage.setItem('pcgLang', language); } catch (e) { }
    // Im claude.ai-Viewer die Adresse nicht anfassen (sie gehört dem Viewer), dort reicht die gemerkte Auswahl.
    if (window.claude) { location.reload(); return; }
    try {
      var url = new URL(location.href);
      url.searchParams.set('lang', language);
      location.href = url.toString();
    } catch (e) { location.reload(); }
  };

  // Pfade der gewählten Dateien innerhalb des gewählten Ordners, in derselben Reihenfolge wie die Dateien.
  window.pcgRelativePaths = function (input) {
    return Array.from((input && input.files) || []).map(function (f) { return f.webkitRelativePath || f.name; });
  };

  // Dem Browser Zeit zum Zeichnen geben, bevor eine lange Rechnung startet.
  window.pcgPaint = function () {
    return new Promise(function (resolve) { requestAnimationFrame(function () { setTimeout(resolve, 0); }); });
  };
</script>
